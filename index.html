<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AppleWorm WiFi</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

    body {
      min-height:100vh;
      background:url("https://images.unsplash.com/photo-1517430816045-df4b7de11d1d") center/cover no-repeat fixed;
      color:#fff;
    }

    .overlay {
      min-height:100vh;
      background:rgba(0,0,0,0.55);
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    h1 { font-size:42px; margin-bottom:10px; }
    .subtitle { font-size:20px; font-weight:600; margin-bottom:6px; }
    .desc { font-size:15px; opacity:.9; margin-bottom:30px; }

    .packages {
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      justify-content:center;
      margin-bottom:25px;
    }

    .btn {
      padding:12px 20px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      color:#fff;
      font-weight:600;
      transition:transform .2s;
    }

    .btn:hover { transform:scale(1.05); }

    .purple{background:#8b5cf6;}
    .pink{background:#ec4899;}
    .orange{background:#f97316;}
    .blue{background:#3b82f6;}
    .red{background:#ef4444;}
    .teal{background:#14b8a6;}
    .green{background:#22c55e;}
    .indigo{background:#6366f1;}
    .whatsapp{background:#25D366;color:#000;}

    footer { font-size:13px; opacity:.8; margin-top:20px; }
  </style>
</head>
<body>

<div class="overlay">
  <div>
    <h1>AppleWorm Studios</h1>
    <div class="subtitle">Fast, Reliable & Affordable Internet</div>
    <div class="desc">Choose a package that suits you</div>

    <div class="packages">
      <button class="btn purple" onclick="bookInstallation('1 Hour Unlimited', '10/-')">1 HOUR @10/-</button>
      <button class="btn pink" onclick="bookInstallation('3 Hours Unlimited', '20/-')">3 HOURS @20/-</button>
      <button class="btn orange" onclick="bookInstallation('6 Hours Unlimited', '30/-')">6 HOURS @30/-</button>
      <button class="btn blue" onclick="bookInstallation('12 Hours Unlimited', '40/-')">12 HOURS @40/-</button>
      <button class="btn red" onclick="bookInstallation('24 Hours Unlimited', '50/-')">24 HOURS @50/-</button>
      <button class="btn orange" onclick="bookInstallation('3 Days Unlimited', '120/-')">3 DAYS @120/-</button>
      <button class="btn teal" onclick="bookInstallation('7 Days Unlimited', '300/-')">7 DAYS @300/-</button>
      <button class="btn green" onclick="bookInstallation('1 Month Unlimited', '800/-')">1 MONTH @800/-</button>
      <button class="btn indigo" onclick="bookInstallation('5Mbps Dedicated Plan', '1000/- per month')">5Mbps PLAN @1000/- Monthly</button>
    </div>

    <button class="btn whatsapp" onclick="contactSupport()">
      Customer Support
    </button>

    <footer>© 2025 APPLEWORM Studios Corp</footer>
  </div>
</div>

<script>
  function bookInstallation(pkg, price) {
    const phone = "254719111040"; // Your WhatsApp number (0719111040)
    const message = `Hello AppleWorm Support,\n\nI would like to book/install:\n*Package:* ${pkg}\n*Price:* ${price}\n\nPlease assist me with the installation and payment details. Thank you!`;

    const whatsappUrl = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    // For mobile devices, direct redirect; for desktop, open in new tab
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = whatsappUrl;
    } else {
      window.open(whatsappUrl, "_blank");
    }
  }

  function contactSupport() {
    const phone = "254719111040";
    const whatsappUrl = "https://wa.me/" + phone;

    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = whatsappUrl;
    } else {
      window.open(whatsappUrl, "_blank");
    }
  }
</script>

</body>
</html>
