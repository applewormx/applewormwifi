<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appleworm WiFi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        .plan-button {
            display: inline-block;
            margin: 10px;
            padding: 15px 25px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .plan-button:hover {
            background-color: #45a049;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 30px;
            border: 1px solid #888;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            text-align: left;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Appleworm WiFi</h1>
    <p>Choose a plan:</p>

    <button class="plan-button" data-plan="1 hr unlimited-10">1 hr - 10</button>
    <button class="plan-button" data-plan="3 hrs unlimited-20">3 hrs - 20</button>
    <button class="plan-button" data-plan="6 hrs unlimited-30">6 hrs - 30</button>
    <button class="plan-button" data-plan="12 hrs unlimited-40">12 hrs - 40</button>
    <button class="plan-button" data-plan="24 hrs unlimited-50">24 hrs - 50</button>
    <button class="plan-button" data-plan="3 days unlimited-120">3 days - 120</button>
    <button class="plan-button" data-plan="7 days unlimited-300">7 days - 300</button>
    <button class="plan-button" data-plan="1 month unlimited-800">1 month - 800</button>

    <!-- Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Payment</h2>
            <p id="selectedPlan"></p>
            <form id="paymentForm">
                <label for="phone">Enter phone number (07xxxxxxx or 01xxxxxxx):</label>
                <input type="text" id="phone" name="phone" maxlength="10" placeholder="0712345678" required>
                <div class="error" id="errorMsg"></div>
                <input type="submit" value="Proceed to Pay">
            </form>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.plan-button');
        const modal = document.getElementById('paymentModal');
        const closeModal = document.querySelector('.close');
        const selectedPlanText = document.getElementById('selectedPlan');
        const paymentForm = document.getElementById('paymentForm');
        const phoneInput = document.getElementById('phone');
        const errorMsg = document.getElementById('errorMsg');

        let selectedPlan = '';

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                selectedPlan = button.getAttribute('data-plan');
                selectedPlanText.textContent = `You selected: ${selectedPlan}`;
                phoneInput.value = '';
                errorMsg.textContent = '';
                modal.style.display = 'block';
            });
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        paymentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = phoneInput.value.trim();

            if (!/^(07|01)\d{8}$/.test(phone)) {
                errorMsg.textContent = 'Invalid phone number format.';
                return;
            }

            // Replace this with real payment integration
            alert(`Proceeding to payment for ${selectedPlan} with phone number: ${phone}`);
            modal.style.display = 'none';
        });
    </script>

</body>
</html>
